<!-- https://www.w3schools.com/HOWTO/howto_website.asp -->
<!-- https://getbootstrap.com/docs/5.3/getting-started/introduction/ -->
<!-- https://www.w3schools.com/bootstrap/bootstrap_grid_basic.asp -->
<!doctype html> <!-- define file as html type -->
<html>
    <head>
        <noscript>Sorry, your browser does not support JavaScript!</noscript>
        <meta charset="UTF-8"> <!-- define character set-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="cssFiles/founderCSS.css">
        <!-- <script src="indexCode.js"></script> import external javascript code file-->
        <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- make web work on all devices and screens-->
        <title>Prototype</title>
    </head>
    
    <body id="body" onload="measureUnderNavHeight()">
        <script src="jsFiles/navbar.js"></script>
        <div style="position: relative;">
            <div class="container" style="display:flex; flex-direction: column; min-height: 100%;">
                <div id="underNav">
                    <div class="mb-4 mt-3" style="height: 400px; background-color: rgba(30, 143, 255, 0.438); border-radius: 5vh; position: relative; overflow: hidden;">
                        <!-- Img slideshow with text to the left. the images change but the text stays the same-->
                        <!-- black to left to make text visible-->
                        <div style="z-index: 98; height: 400px; width: 511.85px; background-image: linear-gradient(to right, rgb(24, 113, 203), rgba(255, 255, 255, 0)); object-fit: cover; border-radius: 5vh; position: absolute;"></div>
                        <div id="homeText" style="position: absolute; z-index: 99;">
                            <div style="width: 45%; margin-top: 20%; margin-left: 5%;">
                                <h1 style="color: white;"><em>All-In</em></h1>
                                <p style="color: white;">
                                    A portfolio website for two projects: one focused on frontend technologies, and the other on backend.
                                </p>
                            </div>
                        </div>
                        <!-- change image using indexCode -->
                        <img id="firstSlide" src="./artRes/drawDemo.gif" class="slideImg"/>
                        <img id="secondSlide" src="./artRes/dbShowcase/country.gif" class="slideImg"/>
                    </div>
                    <div class="container">
                        <!-- inline javascript code -->
                        <!-- https://www.w3schools.com/jsref/met_win_prompt.asp -->
                        <div class="btn-group d-flex gap-2 mb-3" role="group">
                            <button onclick="myFunction('second.html')" type="button" class="btn btn-primary btn-sm">Art Application</button>
                            <button onclick="myFunction('third.html')" type="button" class="btn btn-primary btn-sm">Prison Form Application</button>
                        </div>

                        <!-- mini window for websites -->
                        <!-- responsive aspect ratio: https://www.w3schools.com/howto/howto_css_responsive_iframes.asp-->
                        <div class="containFrame mb-2" id="forTrans">
                            <!-- did not use the fullscreen function to allow use with elements without focus -->
                            <iframe class="responsive-iframe" id="replace" title="project" style="background-color: aliceblue; z-index: auto;"></iframe>
                        </div>
                        
                        <script>
                            function myFunction(i) {
                                document.getElementById("replace").src = i
                                desc(i)
                            }
                        </script>
                        <!-- justify content between spaces them out https://getbootstrap.com/docs/4.0/utilities/flex/ -->
                        <div class="d-flex flex-row justify-content-between">
                            <h5 class="display-6 mt-3" style="color: rgb(18, 84, 150)">Description</h5>
                            <!-- padding: inner space, margin: outer space-->
                            <span><button onclick="descToggle()" class="mt-4 pt-1 btn btn-primary">collapse</button></span>
                        </div>
                        
                        <section id="desc" class="mt-4"></section>
                    </div>
                </div>
                <footer>
                    <hr style="color: rgb(24, 113, 203);">
                    <div class="p-3 text-center">
                        <p class="h5" style="color: rgb(24, 113, 203);"><em>This page was made with Bootstrap, HTML, CSS, and Javascript</em></p>
                    </div>
                    <hr style="color: rgb(24, 113, 203);">
                </footer>
            </div>
        </div>
        <script src="jsFiles/indexCode.js"></script>
    </body>
</html>
