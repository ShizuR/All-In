<!doctype html> <!-- define file as html type -->
<html>
    <head>
        <noscript>Sorry, your browser does not support JavaScript!</noscript>
        <meta charset="UTF-8"> <!-- define character set-->
        <link rel="stylesheet" href=./cssFiles/founderCSS.css>
        <script src="indexCode.js"></script> <!-- import external javascript code file-->
        <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- make web work on all devices and screens-->
        <title>Prototype</title>
    </head>
    
    <body>
        <!-- Navigation -->
        <nav>
        <a href="#home">bruh</a>
        </nav>
        <section>
            <header>WELCOME TO THIS WEBSITE</header>
            <p>I hope you enjoy this mastery over html</p>
            <!-- mini window for websites -->
            <!-- responsive aspect ratio: https://www.w3schools.com/howto/howto_css_responsive_iframes.asp-->
            <div class="container">
                <iframe class="responsive-iframe" id="replace" title="bro"></iframe>
            </div>
        </section>
        <!-- inline javascript code -->
        <!-- https://www.w3schools.com/jsref/met_win_prompt.asp -->
        <button onclick="myFunction('second.html')">display second</button>
        <button onclick="myFunction('third.html')">display third</button>
        <script>
            function myFunction(i) {
                document.getElementById("replace").src = i
            }
        </script>
        <section id="demo"></section>
    </body>
</html>
