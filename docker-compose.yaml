services:
  website:
    image: nginx:latest
    ports: 
      - '7272:80'
    volumes:
      - ./:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
  
  custDB:
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_PASSWORD=${custPW}
      - POSTGRES_USER=${custUSER}
      - POSTGRES_DB=${custDBname}
    volumes:
      - ./pgdata:/docker-entrypoint-initdb.d/ # initialise database data using initialData.sql
    ports:
      - ${custPORT}:5432
    networks:
      - postgres-network
  
  adminer:
    image: adminer
    restart: always
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: primaryDatabase
    networks:
      - postgres-network

networks:
  postgres-network:
    driver: bridge

